<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benim Portföyüm</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #111827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 24px;
    }

    .fish-gif {
      width: 260px;
      max-width: 80vw;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
    }

    /* Küçük ekranlarda başlığı biraz küçült */
    @media (max-width: 420px) {
      h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Merhaba, sitem yayında!</h1>

    <img src="images/fish.gif" alt="Balık GIF" class="fish-gif" loading="lazy">

    <p>Bu site GitHub Pages üzerinde çalışıyor. Çok yakında dümdüz yazı görmenin ötesine geçeceğiz.</p>
  </div>
</body>
</html>
